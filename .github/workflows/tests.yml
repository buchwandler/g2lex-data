name: tests

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
      - run: ruff check .
      - run: pytest

  espeak-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
      - name: Download smoke LexHint dictionary
        run: lexhint dataset download az --variant dictionary --source-variant english
      - name: Install pinned eSpeak-NG
        run: scripts/install_espeak_ng.sh
      - run: g2lex-data build-espeak --locale az --data-version ci-test
      - run: |
          g2lex-data validate \
            --id az:lexhint \
            --id az:espeak \
            --id az:espeak-piper
