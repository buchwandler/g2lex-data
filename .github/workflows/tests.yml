name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: lexhint dataset download de --variant dictionary --version 2026.08.28
      - run: g2lex-data sources
      - run: ruff check .
      - run: pytest
      - run: g2lex-data release --data-version data-2026.09.0-test
