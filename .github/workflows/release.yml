name: publish-data-release
on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Immutable data version, for example 2026.09.02
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/lexhint-datasets
          path: lexhint-datasets
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,espeak]"
      - name: Download current English-source LexHint dictionaries
        run: |
          for lang in ar az bg ca ceb cs de el es fr ga he hi hu hy it ja ko la lt lv mr nl pl pt ro ru sv ta te tl tr uk ur vi zh; do
            lexhint dataset download "$lang" --variant dictionary --source-variant english
          done
      - name: Download current native-source LexHint dictionaries
        run: |
          for lang in cs de el en es fr id it ja ko ku ms pl pt ru th tr vi zh; do
            lexhint dataset download "$lang" --variant dictionary --source-variant native
          done
      - name: Download pinned Crane LexHint dependency
        run: |
          lexhint dataset download de \
            --variant dictionary \
            --source-variant native \
            --version 2026.08.28
      - run: python scripts/check_espeak_coverage.py --json
      - run: g2lex-data build
      - run: pytest
      - run: g2lex-data release --data-version "${{ inputs.data_version }}"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.data_version }}"
          case "$version" in
            data-*) tag="$version" ;;
            *) tag="data-$version" ;;
          esac
          gh release create "$tag" dist/"$tag"/* \
            --title "$tag" \
            --notes "Paired LexHint-backed eSpeak assets; de-de:espeak now means generated IPA, historical CSTR data is de-de:cstr; Piper IPA3 is published as de-de:espeak-piper."
      - name: Commit refreshed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/catalog.json
          git diff --cached --quiet || git commit -m "data: refresh catalog for ${{ inputs.data_version }}"
          git push
