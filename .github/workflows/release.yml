name: publish-data-release
on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Immutable data version, for example 2026.09.02
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: g2lex-data release --data-version "${{ inputs.data_version }}"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-${{ inputs.data_version }}"
          gh release create "$tag" dist/"$tag"/* \
            --title "$tag" \
            --notes "Deterministic G2Lex data release $tag"
      - name: Commit refreshed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/catalog.json
          git diff --cached --quiet || git commit -m "data: refresh catalog for ${{ inputs.data_version }}"
          git push
