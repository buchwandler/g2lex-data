name: publish-data-release
on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Immutable data version, for example 2026.09.02
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: lexhint dataset download cs --variant dictionary --version 2026.08.28
      - run: lexhint dataset download de --variant dictionary --version 2026.08.28
      - run: lexhint dataset download el --variant dictionary --version 2026.09.08
      - run: lexhint dataset download en --variant dictionary --version 2026.08.28
      - run: lexhint dataset download es --variant dictionary --version 2026.08.28
      - run: lexhint dataset download fr --variant dictionary --version 2026.08.28
      - run: lexhint dataset download id --variant dictionary --version 2026.09.08
      - run: lexhint dataset download it --variant dictionary --version 2026.08.28
      - run: lexhint dataset download ja --variant dictionary --version 2026.09.03
      - run: lexhint dataset download ko --variant dictionary --version 2026.09.03
      - run: lexhint dataset download ku --variant dictionary --version 2026.09.08
      - run: lexhint dataset download ms --variant dictionary --version 2026.09.08
      - run: lexhint dataset download pl --variant dictionary --version 2026.09.08
      - run: lexhint dataset download pt --variant dictionary --version 2026.09.03
      - run: lexhint dataset download ru --variant dictionary --version 2026.09.03
      - run: lexhint dataset download th --variant dictionary --version 2026.09.03
      - run: lexhint dataset download tr --variant dictionary --version 2026.09.08
      - run: lexhint dataset download vi --variant dictionary --version 2026.09.03
      - run: lexhint dataset download zh --variant dictionary --version 2026.09.03
      - run: g2lex-data build
      - run: pytest
      - run: g2lex-data release --data-version "${{ inputs.data_version }}"
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.data_version }}"
          case "$version" in
            data-*) tag="$version" ;;
            *) tag="data-$version" ;;
          esac
          gh release create "$tag" dist/"$tag"/* \
            --title "$tag" \
            --notes "Deterministic G2Lex data release $tag"
      - name: Commit refreshed catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/catalog.json
          git diff --cached --quiet || git commit -m "data: refresh catalog for ${{ inputs.data_version }}"
          git push
