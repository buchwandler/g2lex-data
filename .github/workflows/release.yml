name: publish-data-release

on:
  workflow_dispatch:
    inputs:
      data_version:
        description: Immutable data version, for example 2026.09.02
        required: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
      - run: ruff check .
      - run: pytest

  static:
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
      - name: Download unsupported rolling LexHint dictionaries
        run: |
          lexhint dataset download ceb --variant dictionary --source-variant english
          lexhint dataset download tl --variant dictionary --source-variant english
      - name: Download pinned Crane dependency
        run: |
          lexhint dataset download de \
            --variant dictionary \
            --source-variant native \
            --version 2026.08.28
      - name: Build static partition
        run: g2lex-data build-static --data-version "${{ inputs.data_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-static
          path: g2lex-data/build/
          if-no-files-found: error
          retention-days: 1

  espeak:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - shard: "01-fr"
            locales: "fr"
          - shard: "02-de"
            locales: "de-de"
          - shard: "03-es"
            locales: "es"
          - shard: "04-ru"
            locales: "ru"
          - shard: "05"
            locales: "zh la vi nl bg ar ur az lv ms"
          - shard: "06"
            locales: "pl en-us pt-br uk hi lt ro mr"
          - shard: "07"
            locales: "cs en-gb ja hu el ca hy ta te id"
          - shard: "08"
            locales: "it ku pt ko pt-pt tr th ga sv he"
    defaults:
      run:
        working-directory: g2lex-data
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
      - name: Download LexHint sources for shard
        shell: bash
        run: |
          args=()
          for locale in ${{ matrix.locales }}; do
            args+=(--locale "$locale")
          done
          python scripts/download_lexhint_sources.py "${args[@]}"
      - run: python scripts/check_espeak_coverage.py --json
      - name: Build eSpeak locale pairs
        shell: bash
        run: |
          args=()
          for locale in ${{ matrix.locales }}; do
            args+=(--locale "$locale")
          done
          g2lex-data build-espeak \
            "${args[@]}" \
            --data-version "${{ inputs.data_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-espeak-${{ matrix.shard }}
          path: g2lex-data/build/
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs:
      - tests
      - static
      - espeak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: g2lex-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: g2lex-data/pyproject.toml
      - run: python -m pip install -e ".[dev,espeak]"
        working-directory: g2lex-data
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: g2lex-data/build
          merge-multiple: true
      - name: Assemble release without rebuilding
        working-directory: g2lex-data
        run: g2lex-data release --data-version "${{ inputs.data_version }}" --from-build
      - name: Create immutable GitHub release
        working-directory: g2lex-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ inputs.data_version }}"
          case "$version" in
            data-*) tag="$version" ;;
            *) tag="data-$version" ;;
          esac
          gh release create "$tag" dist/"$tag"/* \
            --title "$tag" \
            --notes "Paired LexHint-backed eSpeak assets."
      - name: Commit refreshed catalog
        working-directory: g2lex-data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/catalog.json
          git diff --cached --quiet || git commit -m "data: refresh catalog for ${{ inputs.data_version }}"
          git push
